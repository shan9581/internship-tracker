{% extends "layout.html" %}
{% block content %}
    <h1> {{application.company_name }}</h1>
    <p>{{ application.role }}</p>
    <p> {{ application.pay}} </p>
    
    <a href="{{ url_for('update_application', application_id=application.id) }}">
        <button type="submit">Edit </button>
    </a>
    
    <form action = "{{url_for('delete_application', application_id=application.id) }}" method = "POST">
        <button type="submit" onclick="return confirm('Delete this application?')">Delete</button>
    </form>
    
    
{% endblock%}
